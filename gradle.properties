# STONE - Gradle configuration.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX is not used at all (there is no Java code), but the AGP still wants
# the flags declared explicitly.
android.useAndroidX=true
android.nonTransitiveRClass=true

# Keep the build reproducible and offline-friendly once the plugin is cached.
android.suppressUnsupportedCompileSdk=34
